[pytest]
# This plugin directory is itself a Python package (``__init__.py`` at the repo root, as the
# Hermes plugin loader requires). ``testpaths`` therefore names the ``tests/`` directory
# explicitly: pointing pytest at the repo root makes it collect the plugin's own ``__init__.py``
# as a test package, which then fails on its relative imports.
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
